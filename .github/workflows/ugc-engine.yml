name: Pupper UGC Engine

on:
  schedule:
    # Brief creators Mon, Wed, Fri at 10am ET (15:00 UTC)
    - cron: "0 15 * * 1,3,5"
    # Daily post every day at noon ET (17:00 UTC)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: daily (auto-post) or brief (send to Billo)"
        required: true
        default: "daily"
        type: choice
        options: [daily, brief]

permissions:
  contents: write

jobs:
  brief:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'brief' || github.event.schedule == '0 15 * * 1,3,5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send UGC briefs to Billo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_STORE: pupper.myshopify.com
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BILLO_API_KEY: ${{ secrets.BILLO_API_KEY }}
          ADMIN_EMAIL: aj@portraitpal.ai
          VIDEOS_PER_WEEK: "3"
        run: python -m ugc_engine.main brief
        working-directory: scripts

  daily-post:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily' || github.event.schedule == '0 17 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run daily post
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_STORE: pupper.myshopify.com
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SHOTSTACK_API_KEY: ${{ secrets.SHOTSTACK_API_KEY }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m ugc_engine.main daily
        working-directory: scripts
